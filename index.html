<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EIN Eligibility Validator (Jotform Widget)</title>

  <!-- Jotform Custom Widget API loader -->
 <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script> <!-- [2](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html) -->

  <style>
    :root{
      --ok:#107c10;
      --bad:#a80000;
      --warn:#8a6d3b;
      --muted:#605e5c;
      --border:#d6d6d6;
      --soft:#f7f7f7;
      --radius: 12px;
      --font: 14px/1.35 "Segoe UI", Arial, sans-serif;
    }
    body{ margin:0; padding:12px; font:var(--font); color:#111; background:#fff; }
    .card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px; background:#fff; }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    label{ font-weight:600; }
    input[type="text"]{
      padding:10px 12px; border:1px solid var(--border); border-radius:10px; width:220px;
    }
    select{
      padding:10px 12px; border:1px solid var(--border); border-radius:10px; width: 360px; max-width: 100%;
    }
    button{
      padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--soft); cursor:pointer;
    }
    button.primary{ background:#1f6feb; border-color:#1f6feb; color:#fff; }
    button:disabled{ opacity:.6; cursor:not-allowed; }

    .hint{ color:var(--muted); font-size:12px; margin-top:6px; }

    .badge{
      display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; border:1px solid transparent;
    }
    .badge.ok{ color:var(--ok); border-color: rgba(16,124,16,.35); background: rgba(16,124,16,.08); }
    .badge.bad{ color:var(--bad); border-color: rgba(168,0,0,.35); background: rgba(168,0,0,.08); }
    .badge.warn{ color:var(--warn); border-color: rgba(138,109,59,.35); background: rgba(138,109,59,.12); }
    .badge.neutral{ color:#333; border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.04); }

    .details{ white-space:pre-wrap; font-size:13px; margin-top:10px; }
    .warnBox{
      margin-top:10px; border:1px solid rgba(138,109,59,.35); background: rgba(138,109,59,.12);
      border-radius:10px; padding:10px; color:#5a4a1b; display:none;
    }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
</head>

<body>
  <div class="card">
    <div class="row">
      <div>
        <label for="ein">EIN</label><br/>
        <input id="ein" type="text" inputmode="numeric" placeholder="9 digits (numbers only)" />
        <div class="hint">Format: <span class="mono" id="einPretty">—</span></div>
      </div>

      <div>
        <label for="orgType">Organization Type</label><br/>
        <select id="orgType">
          <option value="501c3">501(c)(3)</option>
          <option value="501c1">501(c)(1)</option>
          <option value="170c1">Government entity under IRC §170(c)(1)</option>
          <option value="other">Other</option>
        </select>
        <div class="hint">“Other” always passes, but shows a documentation note.</div>
      </div>

      <div style="padding-top:18px;">
        <button id="validateBtn" class="primary" type="button">Validate</button>
      </div>
    </div>

    <div style="margin-top:12px;">
      <span id="badge" class="badge neutral">NOT VALIDATED</span>
      <div id="details" class="details">Enter EIN + Type, then click Validate.</div>
      <div id="warnBox" class="warnBox"></div>
    </div>
  </div>

  <script>
    // ProPublica Nonprofit Explorer API v2 supports JSONP via a callback parameter. [1](https://www.youtube.com/watch?v=7DAa8L4pkcg)
    const PROPUBLICA_BASE = "https://projects.propublica.org/nonprofits/api/v2";

    const OTHER_WARNING =
      "Your EIN did not Pass validation of eligibility. Additional documentation may be necessary. " +
      "Please attach any relevant supplemental documents you have at the bottom of this application, " +
      "or we may request additional documentation before funds are issued.";

    const $ein = document.getElementById("ein");
    const $einPretty = document.getElementById("einPretty");
    const $type = document.getElementById("orgType");
    const $btn = document.getElementById("validateBtn");
    const $badge = document.getElementById("badge");
    const $details = document.getElementById("details");
    const $warn = document.getElementById("warnBox");

    let state = {
      ein: "",
      ein_pretty: "",
      claimed_type: "501c3",
      status: "NOT_VALIDATED",       // PASS | FAIL | NOT_VALIDATED
      propublica_found: null,
      subsection_code: null,
      organization_name: null,
      warning: false,
      message: "",
      checked_at: null,
      debug: ""
    };

    let isValidForSubmit = false;

    function normalizeEin(raw) {
      return String(raw || "").replace(/\D/g, "").slice(0, 9);
    }

    function formatEinPretty(d) {
      return (d && d.length === 9) ? (d.slice(0, 2) + "-" + d.slice(2)) : "—";
    }

    function setBadge(kind, text) {
      $badge.className = "badge " + kind;
      $badge.textContent = text;
    }

    function resizeToContent() {
      // Resizing is supported in the custom widget API. [2](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
      try { JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight }); } catch {}
    }

    function sendLiveData() {
      // sendData is part of the custom widget API. [2](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
      try { JFCustomWidget.sendData({ value: JSON.stringify(state) }); } catch {}
    }

    // JSONP helper:
    // We generate a callback function name and pass it as callback=NAME. [1](https://www.youtube.com/watch?v=7DAa8L4pkcg)
    function jsonp(url, timeoutMs = 12000) {
      return new Promise((resolve, reject) => {
        const cbName = "pp_cb_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("JSONP timeout"));
        }, timeoutMs);

        function cleanup() {
          clearTimeout(timer);
          try { delete window[cbName]; } catch {}
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("JSONP script load failed (blocked or network error)"));
        };

        const sep = url.includes("?") ? "&" : "?";
        script.src = url + sep + "callback=" + encodeURIComponent(cbName);
        console.log("JSONP URL:", script.src)
        document.head.appendChild(script);
      });
    }

    async function fetchOrganizationJsonp(einDigits) {
      // Organization endpoint (JSON/JSONP described by ProPublica docs). [1](https://www.youtube.com/watch?v=7DAa8L4pkcg)
      const url = `${PROPUBLICA_BASE}/organizations/${einDigits}.json`;

      // Use JSONP so we avoid CORS.
      const data = await jsonp(url);

      // When ProPublica returns an org record, it is under "organization" per docs. [1](https://www.youtube.com/watch?v=7DAa8L4pkcg)
      const org = data && data.organization ? data.organization : null;

      return { found: !!org, org };
    }

    function decide(claimedType, found, subsection) {
      if (claimedType === "other") return { pass: true, warn: true };
      if (claimedType === "170c1") return { pass: !found, warn: false };
      if (!found) return { pass: false, warn: false };
      if (claimedType === "501c3") return { pass: (subsection === 3), warn: false };
      if (claimedType === "501c1") return { pass: (subsection === 1), warn: false };
      return { pass: false, warn: false };
    }

    function render() {
      if (state.status === "PASS" && state.warning) setBadge("warn", "PASS (Other) — Documentation may be required");
      else if (state.status === "PASS") setBadge("ok", "PASS — Verified");
      else if (state.status === "FAIL") setBadge("bad", "FAIL — Not verified");
      else setBadge("neutral", "NOT VALIDATED");

      const lines = [];
      lines.push(`EIN: ${state.ein_pretty} (${state.ein || "—"})`);
      lines.push(`Selected Type: ${state.claimed_type}`);

      if (state.propublica_found === true) {
        lines.push("Lookup: Found organization");
        if (state.organization_name) lines.push(`Name: ${state.organization_name}`);
        if (typeof state.subsection_code === "number") lines.push(`subsection_code: ${state.subsection_code}`);
      } else if (state.propublica_found === false) {
        lines.push("Lookup: No organization record found");
      }

      if (state.message) { lines.push(""); lines.push(`Summary: ${state.message}`); }
      if (state.debug)   { lines.push(""); lines.push(`Debug: ${state.debug}`); }

      $details.textContent = lines.join("\n");

      if (state.warning) {
        $warn.style.display = "block";
        $warn.textContent = OTHER_WARNING;
      } else {
        $warn.style.display = "none";
        $warn.textContent = "";
      }

      resizeToContent();
    }

    async function validate() {
      const einDigits = normalizeEin($ein.value);
      const claimed = $type.value;

      state.claimed_type = claimed;
      state.ein = einDigits;
      state.ein_pretty = formatEinPretty(einDigits);
      state.checked_at = new Date().toISOString();
      state.warning = false;
      state.organization_name = null;
      state.subsection_code = null;
      state.propublica_found = null;
      state.message = "";
      state.debug = "";

      $einPretty.textContent = state.ein_pretty;

      if (einDigits.length !== 9) {
        state.status = "FAIL";
        state.message = "EIN must be exactly 9 digits (numbers only).";
        isValidForSubmit = false;
        render(); sendLiveData();
        return;
      }

      if (claimed === "other") {
        state.status = "PASS";
        state.warning = true;
        state.message = "Other selected. Additional documentation may be necessary.";
        isValidForSubmit = true;
        render(); sendLiveData();
        return;
      }

      $btn.disabled = true;
      setBadge("neutral", "CHECKING…");
      $details.textContent = "Checking ProPublica (JSONP)…";
      $warn.style.display = "none";
      resizeToContent();

      try {
        const res = await fetchOrganizationJsonp(einDigits);
        state.propublica_found = res.found;

        const org = res.org;
        state.organization_name = org?.name ? String(org.name) : null;
        state.subsection_code = (typeof org?.subsection_code === "number") ? org.subsection_code : null;

        const d = decide(claimed, res.found, state.subsection_code);
        state.status = d.pass ? "PASS" : "FAIL";
        isValidForSubmit = d.pass;

        if (claimed === "170c1") {
          state.message = d.pass
            ? "No organization record found (passes 170(c)(1) rule)."
            : "Found an exempt organization record (fails 170(c)(1) rule).";
        } else {
          state.message = d.pass
            ? "Selection matches classification."
            : (res.found ? "EIN found, but does not match the selected type." : "No organization record found for this EIN.");
        }
      } catch (e) {
        state.status = "FAIL";
        state.message = "Validation failed due to a network/API error.";
        state.debug = String(e.message || e);
        isValidForSubmit = false;
      } finally {
        $btn.disabled = false;
        render(); sendLiveData();
      }
    }

    $btn.addEventListener("click", validate);
    $ein.addEventListener("input", () => {
      const digits = normalizeEin($ein.value);
      if (digits.length > 9) $ein.value = digits.slice(0, 9);
      $einPretty.textContent = formatEinPretty(normalizeEin($ein.value));
      state.status = "NOT VALIDATED";
      state.message = "";
      state.debug = "";
      isValidForSubmit = false;
      render(); sendLiveData();
    });
    $type.addEventListener("change", () => {
      state.status = "NOT VALIDATED";
      state.message = "";
      state.debug = "";
      isValidForSubmit = false;
      render(); sendLiveData();
    });

    // Jotform lifecycle hooks: ready/submit are part of custom widget API. [2](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
    JFCustomWidget.subscribe("ready", function(data) {
      if (data && data.value) {
        try {
          const prev = JSON.parse(data.value);
          if (prev && typeof prev === "object") {
            state = Object.assign(state, prev);
            $ein.value = state.ein || "";
            $einPretty.textContent = state.ein_pretty || formatEinPretty(state.ein);
            if (state.claimed_type) $type.value = state.claimed_type;
            isValidForSubmit = (state.status === "PASS");
            render();
          }
        } catch {}
      }
      resizeToContent();
      sendLiveData();
    });

    JFCustomWidget.subscribe("submit", function() {
      // sendSubmit controls required validation. [2](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
      JFCustomWidget.sendSubmit({
        valid: !!isValidForSubmit,
        value: JSON.stringify(state)
      });
    });
  </script>
</body>
</html>
