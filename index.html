<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EIN Validator (JSONP Debug)</title>

  <!-- Jotform Custom Widget API -->
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    :root{
      --ok:#107c10; --bad:#a80000; --warn:#8a6d3b; --muted:#605e5c;
      --border:#d6d6d6; --soft:#f7f7f7; --radius:12px;
      --font:14px/1.35 "Segoe UI", Arial, sans-serif;
    }
    body{ margin:0; padding:12px; font:var(--font); color:#111; background:#fff; }
    .card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px; background:#fff; }
    .row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    label{ font-weight:600; }
    input, select{ padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; }
    input{ width:220px; }
    select{ width:360px; max-width:100%; }
    button{ padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--soft); cursor:pointer; }
    button.primary{ background:#1f6feb; border-color:#1f6feb; color:#fff; }
    button:disabled{ opacity:.6; cursor:not-allowed; }
    .hint{ color:var(--muted); font-size:12px; margin-top:6px; }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; }
    .badge{ display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; border:1px solid transparent; }
    .badge.ok{ color:var(--ok); border-color: rgba(16,124,16,.35); background: rgba(16,124,16,.08); }
    .badge.bad{ color:var(--bad); border-color: rgba(168,0,0,.35); background: rgba(168,0,0,.08); }
    .badge.neutral{ color:#333; border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.04); }
    .details{ white-space:pre-wrap; font-size:13px; margin-top:10px; }
    .debugPanel{
      margin-top:12px; padding:10px; border:1px dashed #999; border-radius:10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size:12px; white-space:pre-wrap; max-height:340px; overflow:auto; display:none;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="row">
      <div>
        <label for="ein">EIN</label><br/>
        <input id="ein" type="text" inputmode="numeric" placeholder="9 digits" />
        <div class="hint">Format: <span class="mono" id="einPretty">—</span></div>
      </div>

      <div>
        <label for="orgType">Type</label><br/>
        <select id="orgType">
          <option value="501c3">501(c)(3)</option>
          <option value="501c1">501(c)(1)</option>
          <option value="170c1">170(c)(1) Government</option>
          <option value="other">Other</option>
        </select>
        <div class="hint">Debug URL example: <span class="mono">?debug=1&jsonpMode=bare&forceMode=1&dump=1</span></div>
      </div>

      <div>
        <button id="validateBtn" class="primary" type="button">Validate</button>
      </div>
    </div>

    <div style="margin-top:12px;">
      <span id="badge" class="badge neutral">NOT VALIDATED</span>
      <div id="details" class="details">Ready.</div>
      <div id="debugPanel" class="debugPanel"></div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ProPublica API docs indicate JSONP is available by passing a callback parameter. [4](https://sqps.onstreamsecure.com/origin/irsvideoportal/prod/1606-eng-Transcript_1.pdf)
  const PROPUBLICA_BASE = "https://projects.propublica.org/nonprofits/api/v2";

  const qs = new URLSearchParams(location.search);
  const DEBUG = qs.get("debug") === "1";
  const DUMP  = qs.get("dump") === "1";

  // Accept both parameter names so we can't get “wrong variable name” bugs:
  const modeParam = (qs.get("mode") || qs.get("jsonpMode") || "bare").toLowerCase();

  // forceMode=1 means NEVER fall back to another style
  const FORCE_MODE = qs.get("forceMode") === "1";

  const $ein = document.getElementById("ein");
  const $type = document.getElementById("orgType");
  const $btn = document.getElementById("validateBtn");
  const $badge = document.getElementById("badge");
  const $details = document.getElementById("details");
  const $debug = document.getElementById("debugPanel");
  const $einPretty = document.getElementById("einPretty");

  const debugLines = [];
  const safe = (o) => { try { return JSON.stringify(o); } catch { return String(o); } };
  function log(msg, obj) {
    if (!DEBUG) return;
    const line = `[${new Date().toISOString()}] ${msg}` + (obj ? ` | ${safe(obj)}` : "");
    debugLines.push(line);
    if (debugLines.length > 220) debugLines.shift();
    console.log(line);
    $debug.style.display = "block";
    $debug.textContent =
      `DEBUG=1 dump=${DUMP ? 1 : 0} mode=${modeParam} forceMode=${FORCE_MODE ? 1 : 0}\n` +
      `Origin=${location.origin}\n` +
      `JFCustomWidget=${typeof window.JFCustomWidget}\n\n` +
      debugLines.join("\n");
  }

  // Update EIN display
  const normalizeEin = (raw) => String(raw || "").replace(/\D/g, "").slice(0, 9);
  const prettyEin = (d) => (d.length === 9) ? (d.slice(0,2) + "-" + d.slice(2)) : "—";

  function setBadge(kind, text) {
    $badge.className = "badge " + kind;
    $badge.textContent = text;
  }

  function jsonpLoad(finalUrl, cbName, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      log("JSONP start", {
        finalUrl,
        hasCallbackEquals: finalUrl.includes("callback="),
        hasCallbackBare: finalUrl.includes("?callback&") || finalUrl.includes("&callback&") || finalUrl.endsWith("?callback") || finalUrl.includes("?callback&"),
        cbName
      });

      const script = document.createElement("script");
      script.async = true;
      script.src = finalUrl;

      let done = false;
      const start = performance.now();

      function cleanup() {
        done = true;
        try { delete window[cbName]; } catch {}
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      const timer = setTimeout(() => {
        if (done) return;
        cleanup();
        log("JSONP timeout", { ms: Math.round(performance.now() - start), finalUrl });
        reject(new Error("JSONP timeout"));
      }, timeoutMs);

      window[cbName] = (data) => {
        if (done) return;
        clearTimeout(timer);
        cleanup();
        log("JSONP callback fired", { ms: Math.round(performance.now() - start) });
        if (DUMP) {
          try {
            log("DATA keys", Object.keys(data || {}));
            log("DATA preview", String(JSON.stringify(data)).slice(0, 1200));
          } catch (e) {
            log("DATA dump failed", { err: String(e) });
          }
        }
        resolve(data);
      };

      script.onload = () => log("JSONP script onload", { ms: Math.round(performance.now() - start), finalUrl });
      script.onerror = () => {
        clearTimeout(timer);
        cleanup();
        log("JSONP script onerror", { ms: Math.round(performance.now() - start), finalUrl });
        reject(new Error("JSONP script load failed (blocked or network error)"));
      };

      document.head.appendChild(script);
    });
  }

  // Build JSONP URL in the exact mode requested
  function buildJsonpUrl(einDigits, mode) {
    const baseUrl = `${PROPUBLICA_BASE}/organizations/${einDigits}.json`;
    const ts = Date.now();
    const cbName = "ppcb" + ts + Math.floor(Math.random() * 100000);

    let finalUrl;
    if (mode === "bare") {
      finalUrl = `${baseUrl}?callback&ts=${ts}`;
    } else if (mode === "empty") {
      finalUrl = `${baseUrl}?callback=&ts=${ts}`;
    } else {
      // named
      finalUrl = `${baseUrl}?callback=${cbName}&ts=${ts}`;
    }
    return { finalUrl, cbName };
  }

  async function validate() {
    const einDigits = normalizeEin($ein.value);
    $einPretty.textContent = prettyEin(einDigits);

    if (einDigits.length !== 9) {
      setBadge("bad", "FAIL");
      $details.textContent = "EIN must be exactly 9 digits.";
      return;
    }

    setBadge("neutral", "CHECKING…");
    $btn.disabled = true;

    try {
      // Force exactly the requested mode; do not “auto-try named first”
      const { finalUrl, cbName } = buildJsonpUrl(einDigits, modeParam);

      // If forceMode=0 and you want to try fallbacks, you can add that later.
      // Right now you explicitly want to control whether it uses '=' or not.
      if (!FORCE_MODE) {
        log("NOTE", { message: "forceMode is off; but this build uses only the selected modeParam." });
      }

      const data = await jsonpLoad(finalUrl, cbName);

      const org = data && data.organization ? data.organization : null;
      const found = !!org;
      const subsection = org && typeof org.subsection_code === "number" ? org.subsection_code : null;

      setBadge("ok", "RECEIVED DATA");
      $details.textContent =
        `Found: ${found}\n` +
        `Name: ${org && org.name ? org.name : ""}\n` +
        `subsection_code: ${subsection}\n` +
        `Raw organization object present: ${!!org}`;

    } catch (e) {
      setBadge("bad", "FAIL");
      $details.textContent = "Debug: " + String(e && e.message ? e.message : e);
      log("VALIDATE failed", { err: String(e) });
    } finally {
      $btn.disabled = false;
    }
  }

  $btn.addEventListener("click", validate);
  $ein.addEventListener("input", () => {
    const d = normalizeEin($ein.value);
    if (d.length > 9) $ein.value = d.slice(0, 9);
    $einPretty.textContent = prettyEin(normalizeEin($ein.value));
  });

  // Initial debug line
  log("Loaded", { modeParam, FORCE_MODE });

})();
</script>

</body>
</html>
