<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EIN Validator (Debuggable JSONP)</title>

  <!-- Jotform Custom Widget API (required when used as a Jotform widget) -->
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    :root{
      --ok:#107c10; --bad:#a80000; --warn:#8a6d3b; --muted:#605e5c;
      --border:#d6d6d6; --soft:#f7f7f7; --radius:12px;
      --font:14px/1.35 "Segoe UI", Arial, sans-serif;
    }
    body{ margin:0; padding:12px; font:var(--font); color:#111; background:#fff; }
    .card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px; background:#fff; }
    .row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    label{ font-weight:600; }
    input, select{
      padding:10px 12px; border:1px solid var(--border);
      border-radius:10px; font-size:14px;
    }
    input{ width:220px; }
    select{ width:360px; max-width:100%; }
    button{
      padding:10px 12px; border:1px solid var(--border);
      border-radius:10px; background:var(--soft); cursor:pointer;
    }
    button.primary{ background:#1f6feb; border-color:#1f6feb; color:#fff; }
    button:disabled{ opacity:.6; cursor:not-allowed; }

    .hint{ color:var(--muted); font-size:12px; margin-top:6px; }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; }

    .badge{
      display:inline-block; padding:6px 10px; border-radius:999px;
      font-weight:700; border:1px solid transparent;
    }
    .badge.ok{ color:var(--ok); border-color: rgba(16,124,16,.35); background: rgba(16,124,16,.08); }
    .badge.bad{ color:var(--bad); border-color: rgba(168,0,0,.35); background: rgba(168,0,0,.08); }
    .badge.warn{ color:var(--warn); border-color: rgba(138,109,59,.35); background: rgba(138,109,59,.12); }
    .badge.neutral{ color:#333; border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.04); }

    .details{ white-space:pre-wrap; font-size:13px; margin-top:10px; }

    .warnBox{
      margin-top:10px;
      border:1px solid rgba(138,109,59,.35);
      background: rgba(138,109,59,.12);
      border-radius:10px;
      padding:10px;
      color:#5a4a1b;
      display:none;
    }

    .debugPanel{
      margin-top:12px;
      padding:10px;
      border:1px dashed #999;
      border-radius:10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size:12px;
      white-space:pre-wrap;
      max-height:340px;
      overflow:auto;
      display:none;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="row">
      <div>
        <label for="ein">EIN</label><br/>
        <input id="ein" type="text" inputmode="numeric" placeholder="9 digits" />
        <div class="hint">Format: <span class="mono" id="einPretty">—</span></div>
      </div>

      <div>
        <label for="orgType">Type</label><br/>
        <select id="orgType">
          <option value="501c3">501(c)(3)</option>
          <option value="501c1">501(c)(1)</option>
          <option value="170c1">170(c)(1) Government</option>
          <option value="other">Other</option>
        </select>
        <div class="hint">Tip: Try debug mode with <span class="mono">?debug=1&dump=1&mode=named</span></div>
      </div>

      <div>
        <button id="validateBtn" class="primary" type="button">Validate</button>
      </div>
    </div>

    <div style="margin-top:12px;">
      <span id="badge" class="badge neutral">NOT VALIDATED</span>
      <div id="details" class="details">Ready.</div>
      <div id="warnBox" class="warnBox"></div>
      <div id="debugPanel" class="debugPanel"></div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ProPublica Nonprofit Explorer API v2 base. JSONP is described as supported via a callback parameter. [1](https://github.com/mcbridek/jotform-autocomplete-v2/blob/main/README.md)
  const PROPUBLICA_BASE = "https://projects.propublica.org/nonprofits/api/v2";

  const qs = new URLSearchParams(window.location.search);
  const DEBUG = qs.get("debug") === "1";
  const DUMP  = qs.get("dump") === "1";
  // mode: named | bare | empty
  const MODE  = (qs.get("mode") || "named").toLowerCase();

  const OTHER_WARNING =
    "Your EIN did not Pass validation of eligibility. Additional documentation may be necessary. " +
    "Please attach any relevant supplemental documents you have at the bottom of this application, " +
    "or we may request additional documentation before funds are issued.";

  // DOM
  const $ein = document.getElementById("ein");
  const $type = document.getElementById("orgType");
  const $btn = document.getElementById("validateBtn");
  const $badge = document.getElementById("badge");
  const $details = document.getElementById("details");
  const $warn = document.getElementById("warnBox");
  const $debug = document.getElementById("debugPanel");
  const $einPretty = document.getElementById("einPretty");

  // Debug logger
  const debugLines = [];
  const safe = (o) => { try { return JSON.stringify(o); } catch { return String(o); } };

  function log(msg, obj) {
    if (!DEBUG) return;
    const line = `[${new Date().toISOString()}] ${msg}` + (obj ? ` | ${safe(obj)}` : "");
    debugLines.push(line);
    if (debugLines.length > 200) debugLines.shift();
    console.log(line);
    $debug.style.display = "block";
    $debug.textContent =
      `DEBUG=1 dump=${DUMP ? 1 : 0} mode=${MODE}\n` +
      `Origin=${location.origin}\n` +
      `JFCustomWidget=${typeof window.JFCustomWidget}\n\n` +
      debugLines.join("\n");
  }

  // Capture CSP violations (if any)
  window.addEventListener("securitypolicyviolation", (e) => {
    log("CSP VIOLATION", { blockedURI: e.blockedURI, directive: e.effectiveDirective });
  });

  // Helpers
  const normalizeEin = (raw) => String(raw || "").replace(/\D/g, "").slice(0, 9);
  const prettyEin = (d) => (d.length === 9) ? (d.slice(0,2) + "-" + d.slice(2)) : "—";

  function setBadge(kind, text) {
    $badge.className = "badge " + kind;
    $badge.textContent = text;
  }

  // Decision logic (your original rules)
  function decide(type, found, subsection) {
    if (type === "other") return { pass: true, reason: "OTHER_ALWAYS_PASS" };
    if (type === "170c1") return { pass: !found, reason: (!found ? "NOT_FOUND_MATCH" : "FOUND_MISMATCH") };
    if (!found) return { pass: false, reason: "NOT_FOUND" };
    if (type === "501c3") return { pass: subsection === 3, reason: (subsection === 3 ? "MATCH_501C3" : "SUBSECTION_MISMATCH") };
    if (type === "501c1") return { pass: subsection === 1, reason: (subsection === 1 ? "MATCH_501C1" : "SUBSECTION_MISMATCH") };
    return { pass: false, reason: "UNKNOWN" };
  }

  // Update UI warn box
  function setWarning(show) {
    if (show) {
      $warn.style.display = "block";
      $warn.textContent = OTHER_WARNING;
    } else {
      $warn.style.display = "none";
      $warn.textContent = "";
    }
  }

  // Resize when in Jotform widget context
  function resizeToContent() {
    try {
      if (window.JFCustomWidget) {
        JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight });
      }
    } catch {}
  }

  // Send value back to Jotform if present
  function sendToJotform(valueObj, validBool) {
    try {
      if (!window.JFCustomWidget) return;
      JFCustomWidget.sendData({ value: JSON.stringify(valueObj) }); // [2](https://projects.propublica.org/nonprofits/)
      // On submit we’ll sendSubmit; here we only keep value updated.
    } catch {}
  }

  // JSONP loader:
  // - named: callback=<cbName>
  // - empty: callback=
  // - bare : callback  (no equals)
  function jsonpOrg(einDigits, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const baseUrl = `${PROPUBLICA_BASE}/organizations/${einDigits}.json`;
      const ts = Date.now();
      const cbName = "ppcb" + ts + Math.floor(Math.random() * 100000);

      let finalUrl;
      if (MODE === "named") {
        finalUrl = `${baseUrl}?callback=${cbName}&ts=${ts}`;
      } else if (MODE === "empty") {
        finalUrl = `${baseUrl}?callback=&ts=${ts}`;
      } else {
        finalUrl = `${baseUrl}?callback&ts=${ts}`;
      }

      log("JSONP start", { finalUrl });

      const script = document.createElement("script");
      script.async = true;
      script.src = finalUrl;

      let done = false;
      const start = performance.now();

      function cleanup() {
        done = true;
        try { delete window[cbName]; } catch {}
        try { delete window.callback; } catch {}
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      const timer = setTimeout(() => {
        if (done) return;
        log("JSONP timeout", { ms: Math.round(performance.now() - start), finalUrl });
        cleanup();
        reject(new Error("JSONP timeout"));
      }, timeoutMs);

      // Named callback
      window[cbName] = (data) => {
        if (done) return;
        clearTimeout(timer);
        log("JSONP callback fired (named)", { ms: Math.round(performance.now() - start) });
        if (DUMP) {
          log("JSON keys", Object.keys(data || {}));
          log("JSON preview", String(JSON.stringify(data)).slice(0, 1200));
        }
        cleanup();
        resolve(data);
      };

      // Bare callback handler (if the server uses a default global function name)
      window.callback = (data) => {
        if (done) return;
        clearTimeout(timer);
        log("JSONP callback fired (bare->callback)", { ms: Math.round(performance.now() - start) });
        if (DUMP) {
          log("JSON keys", Object.keys(data || {}));
          log("JSON preview", String(JSON.stringify(data)).slice(0, 1200));
        }
        cleanup();
        resolve(data);
      };

      script.onload = () => log("JSONP script onload", { ms: Math.round(performance.now() - start), finalUrl });
      script.onerror = () => {
        clearTimeout(timer);
        log("JSONP script onerror", { ms: Math.round(performance.now() - start), finalUrl });
        cleanup();
        reject(new Error("JSONP script load failed (blocked or network error)"));
      };

      document.head.appendChild(script);
    });
  }

  // Main validate click handler
  async function validate() {
    try {
      const einDigits = normalizeEin($ein.value);
      const claimed = $type.value;

      $einPretty.textContent = prettyEin(einDigits);
      setWarning(false);

      if (einDigits.length !== 9) {
        setBadge("bad", "FAIL");
        $details.textContent = "EIN must be exactly 9 digits.";
        return;
      }

      if (claimed === "other") {
        setBadge("warn", "PASS (Other)");
        setWarning(true);
        $details.textContent = "Other selected (passes). Documentation may be required.";
        return;
      }

      setBadge("neutral", "CHECKING…");
      $btn.disabled = true;

      const data = await jsonpOrg(einDigits);
      const org = (data && data.organization) ? data.organization : null;

      const found = !!org;
      const subsection = (org && typeof org.subsection_code === "number") ? org.subsection_code : null;
      const name = (org && org.name) ? String(org.name) : "";

      const d = decide(claimed, found, subsection);

      setBadge(d.pass ? "ok" : "bad", d.pass ? "PASS" : "FAIL");
      $details.textContent =
        `Found: ${found}\n` +
        `Name: ${name}\n` +
        `subsection_code: ${subsection}\n` +
        `Decision: ${d.reason}`;

      // Push result to Jotform value if in widget context
      const payload = {
        ein: einDigits,
        claimed_type: claimed,
        found,
        name,
        subsection_code: subsection,
        pass: d.pass,
        decision: d.reason,
        checked_at: new Date().toISOString(),
        mode: MODE
      };
      sendToJotform(payload, d.pass);

    } catch (e) {
      setBadge("bad", "FAIL");
      $details.textContent = "Debug: " + String(e && e.message ? e.message : e);
      log("VALIDATE failed", { err: String(e) });
    } finally {
      $btn.disabled = false;
      resizeToContent();
    }
  }

  // Wire events
  $btn.addEventListener("click", validate);

  $ein.addEventListener("input", () => {
    const d = normalizeEin($ein.value);
    if (d.length > 9) $ein.value = d.slice(0, 9);
    $einPretty.textContent = prettyEin(normalizeEin($ein.value));
  });

  // Jotform lifecycle hooks (only run if JFCustomWidget exists) [2](https://projects.propublica.org/nonprofits/)
  if (window.JFCustomWidget) {
    JFCustomWidget.subscribe("ready", () => {
      log("JFCustomWidget ready");
      resizeToContent();
    });

    JFCustomWidget.subscribe("submit", () => {
      // If you set this widget field Required in Jotform, you can enforce pass/fail here later.
      // For now we allow submission; you can wire strict validation once JSONP works reliably.
      JFCustomWidget.sendSubmit({ valid: true, value: "" });
    });
  }

  if (DEBUG) log("Loaded");
})();
</script>

</body>
</html>
