<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EIN Validator</title>

  <!-- Jotform Custom Widget API -->
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    :root{
      --ok:#107c10; --bad:#a80000; --muted:#605e5c;
      --border:#d6d6d6; --soft:#f7f7f7; --radius:12px;
      --font:14px/1.35 "Segoe UI", Arial, sans-serif;
    }
    body{ margin:0; padding:12px; font:var(--font); color:#111; background:#fff; }
    .card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px; background:#fff; }
    .row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    label{ font-weight:600; }
    input, select{ padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; }
    input{ width:220px; }
    select{ width:360px; max-width:100%; }
    button{ padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--soft); cursor:pointer; }
    button.primary{ background:#1f6feb; border-color:#1f6feb; color:#fff; }
    button:disabled{ opacity:.6; cursor:not-allowed; }
    .hint{ color:var(--muted); font-size:12px; margin-top:6px; }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; }
    .badge{ display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; border:1px solid transparent; }
    .badge.ok{ color:var(--ok); border-color: rgba(16,124,16,.35); background: rgba(16,124,16,.08); }
    .badge.bad{ color:var(--bad); border-color: rgba(168,0,0,.35); background: rgba(168,0,0,.08); }
    .badge.neutral{ color:#333; border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.04); }
    .details{ white-space:pre-wrap; font-size:13px; margin-top:10px; }
    .debugPanel{
      margin-top:12px; padding:10px; border:1px dashed #999; border-radius:10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size:12px; white-space:pre-wrap; max-height:340px; overflow:auto; display:none;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="row">
      <div>
        <label for="ein">EIN</label><br/>
        <input id="ein" type="text" inputmode="numeric" placeholder="9 digits" />
        <div class="hint">Format: <span class="mono" id="einPretty">—</span></div>
      </div>

      <div>
        <label for="orgType">Type</label><br/>
        <select id="orgType">
          <option value="501c3">501(c)(3)</option>
          <option value="501c1">501(c)(1)</option>
          <option value="170c1">170(c)(1) Government</option>
          <option value="other">Other</option>
        </select>
        <div class="hint">Debug: <span class="mono">?debug=1&dump=1</span></div>
      </div>

      <div>
        <button id="validateBtn" class="primary" type="button">Validate</button>
      </div>
    </div>

    <div style="margin-top:12px;">
      <span id="badge" class="badge neutral">NOT VALIDATED</span>
      <div id="details" class="details">Ready.</div>
      <div id="debugPanel" class="debugPanel"></div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const qs    = new URLSearchParams(location.search);
  const DEBUG = qs.get("debug") === "1";
  const DUMP  = qs.get("dump")  === "1";

  // When hosted on Vercel, /api/ein is served by the serverless function.
  // Override with ?apiBase=https://your-project.vercel.app if index.html
  // is hosted elsewhere (e.g. GitHub Pages).
  const API_BASE = qs.get("apiBase") || "";

  const $ein       = document.getElementById("ein");
  const $btn       = document.getElementById("validateBtn");
  const $badge     = document.getElementById("badge");
  const $details   = document.getElementById("details");
  const $debug     = document.getElementById("debugPanel");
  const $einPretty = document.getElementById("einPretty");

  // ── Jotform widget state ────────────────────────────────────────────────────
  // validatedEin holds the formatted EIN (XX-XXXXXXX) once validated,
  // or "" if not yet validated. This is the value sent back to the form.
  let validatedEin = "";

  // ── Debug logging ───────────────────────────────────────────────────────────
  const debugLines = [];
  const safe = (o) => { try { return JSON.stringify(o, null, 2); } catch { return String(o); } };

  function log(msg, obj) {
    if (!DEBUG) return;
    const line = `[${new Date().toISOString()}] ${msg}` + (obj !== undefined ? `\n${safe(obj)}` : "");
    debugLines.push(line);
    if (debugLines.length > 220) debugLines.shift();
    console.log(line);
    $debug.style.display = "block";
    $debug.textContent =
      `DEBUG=1  dump=${DUMP ? 1 : 0}\nOrigin=${location.origin}\n` +
      `JFCustomWidget=${typeof window.JFCustomWidget}\n\n` +
      debugLines.join("\n\n");
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  const normalizeEin = (raw) => String(raw || "").replace(/\D/g, "").slice(0, 9);
  const prettyEin    = (d)   => d.length === 9 ? `${d.slice(0,2)}-${d.slice(2)}` : "—";

  function setBadge(kind, text) {
    $badge.className = "badge " + kind;
    $badge.textContent = text;
  }

  // ── API call ─────────────────────────────────────────────────────────────────
  async function fetchEin(einDigits, timeoutMs = 15000) {
    const url = `${API_BASE}/api/ein?ein=${einDigits}`;
    log("fetch →", url);

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);

    try {
      const res = await fetch(url, { signal: controller.signal });
      log("HTTP status", res.status);
      if (res.status === 404) return null;
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(`HTTP ${res.status} — ${body.error ?? res.statusText}`);
      }
      const data = await res.json();
      if (DUMP) log("response body", data);
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  // ── Jotform integration ──────────────────────────────────────────────────────
  // JFCustomWidget is injected by Jotform when this page runs as a custom widget.
  // If it's missing or non-functional, we degrade gracefully and warn the developer.
  const JF_SETUP_INSTRUCTIONS = `
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  Jotform Custom Widget — NOT CONNECTED
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  The widget is running outside of Jotform (or the
  JFCustomWidget API failed to load). The EIN validator
  works normally, but validated values will NOT be sent
  back to the form.

  To connect this widget to Jotform:
  1. In your form, add a "Widget" field (Add Form Element
     → Widgets → search "Custom Widget").
  2. In the widget settings, set the Widget URL to the
     URL where this index.html is hosted (your Vercel URL).
  3. Add a separate Short Text field for the EIN result,
     mark it Read Only, and note its field ID/name.
  4. In the Widget field's Advanced settings, map the
     widget's output value to that Short Text field.
  5. Make sure https://js.jotform.com/JotFormCustomWidget.min.js
     is not blocked by a Content Security Policy.
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;

  function detectJotform() {
    if (typeof window.JFCustomWidget === "undefined") return false;
    if (typeof window.JFCustomWidget.subscribe !== "function") return false;
    if (typeof window.JFCustomWidget.setValue   !== "function") return false;
    if (typeof window.JFCustomWidget.sendSubmit !== "function") return false;
    return true;
  }

  const IN_JOTFORM = detectJotform();
  log("Jotform detected", IN_JOTFORM);

  if (!IN_JOTFORM) {
    console.warn(JF_SETUP_INSTRUCTIONS);
  }

  function jfSetValue(formatted) {
    validatedEin = formatted;
    if (IN_JOTFORM) {
      JFCustomWidget.setValue(formatted);
      log("JFCustomWidget.setValue", formatted);
    }
  }

  function jfClearValue() {
    validatedEin = "";
    if (IN_JOTFORM) {
      JFCustomWidget.setValue("");
      log("JFCustomWidget.setValue cleared");
    }
  }

  if (IN_JOTFORM) {
    // Restore any previously saved value when the widget loads
    JFCustomWidget.subscribe("ready", (data) => {
      log("JF ready", data);
      const existing = JFCustomWidget.getValue();
      if (existing) {
        $ein.value  = String(existing).replace(/\D/g, "");
        $einPretty.textContent = existing;
        validatedEin = existing;
        setBadge("ok", "VALID");
        $details.textContent = `Previously validated: ${existing}`;
        log("restored value", existing);
      }
    });

    // Send the validated EIN back to Jotform on form submit
    JFCustomWidget.subscribe("submit", () => {
      log("JF submit, sending", validatedEin);
      JFCustomWidget.sendSubmit({ value: validatedEin });
    });
  }

  // ── Validate ─────────────────────────────────────────────────────────────────
  async function validate() {
    const einDigits = normalizeEin($ein.value);
    $einPretty.textContent = prettyEin(einDigits);

    if (einDigits.length !== 9) {
      setBadge("bad", "FAIL");
      $details.textContent = "EIN must be exactly 9 digits.";
      jfClearValue();
      return;
    }

    setBadge("neutral", "CHECKING…");
    $btn.disabled = true;
    jfClearValue();

    try {
      const data = await fetchEin(einDigits);

      if (!data || !data.organization) {
        setBadge("bad", "NOT FOUND");
        $details.textContent =
          `EIN ${prettyEin(einDigits)} was not found in the ProPublica database.\n` +
          `This may mean it is not a tax-exempt organization, or it has not yet been indexed.`;
        return;
      }

      const org        = data.organization;
      const subsection = typeof org.subsection_code === "number" ? org.subsection_code : null;
      const formatted  = prettyEin(einDigits);

      setBadge("ok", "VALID");
      $details.textContent =
        `Name:             ${org.name        ?? "—"}\n` +
        `EIN:              ${formatted}\n` +
        `subsection_code:  ${subsection      ?? "—"}\n` +
        `State:            ${org.state       ?? "—"}\n` +
        `City:             ${org.city        ?? "—"}\n` +
        `NTEE:             ${org.ntee_code   ?? "—"}\n` +
        `Ruling date:      ${org.ruling_date ?? "—"}`;

      // ✅ Populate the Jotform field with the validated EIN
      jfSetValue(formatted);

    } catch (e) {
      setBadge("bad", "ERROR");
      $details.textContent = String(e?.message ?? e);
      log("validate failed", String(e));
    } finally {
      $btn.disabled = false;
    }
  }

  $btn.addEventListener("click", validate);
  $ein.addEventListener("keydown", (e) => { if (e.key === "Enter") validate(); });
  $ein.addEventListener("input", () => {
    const d = normalizeEin($ein.value);
    if (d.length > 9) $ein.value = d.slice(0, 9);
    $einPretty.textContent = prettyEin(normalizeEin($ein.value));
    // Clear validated state if the user edits the EIN after a successful lookup
    if (validatedEin) jfClearValue();
  });

  log("Loaded");
})();
</script>

</body>
</html>
