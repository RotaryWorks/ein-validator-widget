<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EIN Validator (Debuggable)</title>

  <!-- Jotform Custom Widget API (correct include) -->
 <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>  <!-- [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html) -->
  <style>
    :root{
      --ok:#107c10; --bad:#a80000; --warn:#8a6d3b; --muted:#605e5c;
      --border:#d6d6d6; --soft:#f7f7f7; --radius:12px;
      --font:14px/1.35 "Segoe UI", Arial, sans-serif;
    }
    body{ margin:0; padding:12px; font:var(--font); color:#111; background:#fff; }
    .card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px; background:#fff; }
    .row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    label{ font-weight:600; }
    input, select{ padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; }
    input{ width:220px; }
    select{ width:360px; max-width:100%; }
    button{ padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--soft); cursor:pointer; }
    button.primary{ background:#1f6feb; border-color:#1f6feb; color:#fff; }
    button:disabled{ opacity:.6; cursor:not-allowed; }
    .hint{ color:var(--muted); font-size:12px; margin-top:6px; }
    .badge{ display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; border:1px solid transparent; }
    .badge.ok{ color:var(--ok); border-color: rgba(16,124,16,.35); background: rgba(16,124,16,.08); }
    .badge.bad{ color:var(--bad); border-color: rgba(168,0,0,.35); background: rgba(168,0,0,.08); }
    .badge.warn{ color:var(--warn); border-color: rgba(138,109,59,.35); background: rgba(138,109,59,.12); }
    .badge.neutral{ color:#333; border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.04); }
    .details{ white-space:pre-wrap; font-size:13px; margin-top:10px; }
    .debugPanel{
      margin-top:12px; padding:10px; border:1px dashed #999; border-radius:10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size:12px; white-space:pre-wrap; max-height:320px; overflow:auto; display:none;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="row">
      <div>
        <label for="ein">EIN</label><br/>
        <input id="ein" type="text" inputmode="numeric" placeholder="9 digits" />
        <div class="hint" id="einPretty"></div>
      </div>

      <div>
        <label for="orgType">Type</label><br/>
        <select id="orgType">
          <option value="501c3">501(c)(3)</option>
          <option value="501c1">501(c)(1)</option>
          <option value="170c1">170(c)(1) Gov</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div>
        <button id="validateBtn" class="primary" type="button">Validate</button>
      </div>
    </div>

    <div style="margin-top:12px;">
      <span id="badge" class="badge neutral">NOT VALIDATED</span>
      <div id="details" class="details">Ready.</div>
      <div id="debugPanel" class="debugPanel"></div>
    </div>
  </div>

<script>
  // ProPublica API docs: GET base and JSONP via callback parameter. [1](https://www.law.cornell.edu/uscode/text/26/501)
  const PROPUBLICA_BASE = "https://projects.propublica.org/nonprofits/api/v2";

  const qs = new URLSearchParams(location.search);
  const DEBUG = qs.get("debug") === "1";
  const DUMP = qs.get("dump") === "1";
  const JSONP_MODE = (qs.get("jsonpMode") || "auto").toLowerCase(); // auto|named|bare

  const $ein = document.getElementById("ein");
  const $type = document.getElementById("orgType");
  const $btn = document.getElementById("validateBtn");
  const $badge = document.getElementById("badge");
  const $details = document.getElementById("details");
  const $debug = document.getElementById("debugPanel");
  const $einPretty = document.getElementById("einPretty");

  let debugLines = [];
  function log(msg, obj){
    if (!DEBUG) return;
    const line = `[${new Date().toISOString()}] ${msg}` + (obj ? ` | ${safe(obj)}` : "");
    debugLines.push(line);
    if (debugLines.length > 120) debugLines.shift();
    console.log(line);
    $debug.style.display = "block";
    $debug.textContent = `DEBUG=1 dump=${DUMP} jsonpMode=${JSONP_MODE}\nOrigin=${location.origin}\n\n` + debugLines.join("\n");
  }
  function safe(o){ try { return JSON.stringify(o); } catch { return String(o); } }

  // Capture CSP blocks
  window.addEventListener("securitypolicyviolation", (e) => {
    log("CSP VIOLATION", { blockedURI: e.blockedURI, directive: e.effectiveDirective });
  });

  function normalizeEin(raw){ return String(raw||"").replace(/\D/g,"").slice(0,9); }
  function prettyEin(d){ return (d.length===9) ? `${d.slice(0,2)}-${d.slice(2)}` : "—"; }
  function setBadge(kind, text){ $badge.className = "badge " + kind; $badge.textContent = text; }

  function decide(type, found, subsection){
    if (type === "other") return { pass:true, reason:"OTHER_ALWAYS_PASS" };
    if (type === "170c1") return { pass: !found, reason: (!found ? "NOT_FOUND_MATCH" : "FOUND_MISMATCH") };
    if (!found) return { pass:false, reason:"NOT_FOUND" };
    if (type === "501c3") return { pass: subsection === 3, reason: (subsection===3 ? "MATCH_501C3" : "SUBSECTION_MISMATCH") };
    if (type === "501c1") return { pass: subsection === 1, reason: (subsection===1 ? "MATCH_501C1" : "SUBSECTION_MISMATCH") };
    return { pass:false, reason:"UNKNOWN" };
  }

  // JSONP loader with explicit debug
  function jsonpLoad(finalUrl, cbName, timeoutMs=12000){
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      let done = false;
      const start = performance.now();

      function cleanup(){
        done = true;
        try { delete window[cbName]; } catch {}
        try { delete window.callback; } catch {}
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      const timer = setTimeout(() => {
        if (done) return;
        log("JSONP timeout", { finalUrl, ms: Math.round(performance.now()-start) });
        cleanup();
        reject(new Error("JSONP timeout"));
      }, timeoutMs);

      // Named callback
      window[cbName] = (data) => {
        if (done) return;
        clearTimeout(timer);
        log("JSONP callback fired (named)", { ms: Math.round(performance.now()-start) });
        if (DUMP) log("JSONP DATA (named) keys", Object.keys(data||{}));
        cleanup();
        resolve(data);
      };

      // Bare callback handler (some implementations call global callback())
      window.callback = (data) => {
        if (done) return;
        clearTimeout(timer);
        log("JSONP callback fired (bare->callback)", { ms: Math.round(performance.now()-start) });
        if (DUMP) log("JSONP DATA (bare) keys", Object.keys(data||{}));
        cleanup();
        resolve(data);
      };

      script.onload = () => log("JSONP script onload", { finalUrl, ms: Math.round(performance.now()-start) });
      script.onerror = () => {
        clearTimeout(timer);
        log("JSONP script onerror", { finalUrl, ms: Math.round(performance.now()-start) });
        cleanup();
        reject(new Error("JSONP script load failed (blocked or network error)"));
      };

      log("JSONP start", { finalUrl });
      script.async = true;
      script.src = finalUrl;
      document.head.appendChild(script);
    });
  }

  async function propublicaOrgJsonp(einDigits){
    const baseUrl = `${PROPUBLICA_BASE}/organizations/${einDigits}.json`; [1](https://www.law.cornell.edu/uscode/text/26/501)
    const ts = Date.now();
    const sep = baseUrl.includes("?") ? "&" : "?";

    // Build both variants so you can see exactly what succeeds
    const cbName = "ppcb" + ts + Math.floor(Math.random()*100000);

    const namedUrl = `${baseUrl}${sep}callback=${cbName}&ts=${ts}`;
    const bareUrl  = `${baseUrl}${sep}callback&ts=${ts}`;

    if (JSONP_MODE === "named") return await jsonpLoad(namedUrl, cbName);
    if (JSONP_MODE === "bare")  return await jsonpLoad(bareUrl, cbName);

    // auto mode: try named first, then bare
    try {
      log("Auto: trying named", { namedUrl });
      return await jsonpLoad(namedUrl, cbName);
    } catch (e1) {
      log("Auto: named failed; trying bare", { error: String(e1), bareUrl });
      return await jsonpLoad(bareUrl, cbName);
    }
  }

  async function validate(){
    const einDigits = normalizeEin($ein.value);
    const claimed = $type.value;
    $einPretty.textContent = `Format: ${prettyEin(einDigits)}`;

    if (einDigits.length !== 9){
      setBadge("bad","FAIL");
      $details.textContent = "EIN must be exactly 9 digits.";
      return;
    }

    if (claimed === "other"){
      setBadge("warn","PASS (Other)");
      $details.textContent = "Other selected. Documentation may be required.";
      return;
    }

    setBadge("neutral","CHECKING…");
    $btn.disabled = true;

    try{
      const data = await propublicaOrgJsonp(einDigits);
      if (DUMP) log("JSONP DATA (raw preview)", safe(data).slice(0, 500));

      const org = data && data.organization ? data.organization : null;
      const found = !!org;
      const subsection = org && typeof org.subsection_code === "number" ? org.subsection_code : null;
      const name = org && org.name ? String(org.name) : "";

      const d = decide(claimed, found, subsection);

      setBadge(d.pass ? "ok" : "bad", d.pass ? "PASS" : "FAIL");
      $details.textContent =
        `Found: ${found}\n` +
        `Name: ${name}\n` +
        `subsection_code: ${subsection}\n` +
        `Decision: ${d.reason}`;

    } catch (e){
      setBadge("bad","FAIL");
      $details.textContent = `Debug: ${String(e.message || e)}`;
      log("VALIDATE failed", { err: String(e) });
    } finally {
      $btn.disabled = false;
    }
  }

  $btn.addEventListener("click", validate);

  // Make it not crash outside Jotform
  if (window.JFCustomWidget){
    JFCustomWidget.subscribe("ready", () => log("JFCustomWidget ready")); [2](https://projects.propublica.org/nonprofits/)
    JFCustomWidget.subscribe("submit", () => {
      // not enforcing here; you can wire later
      JFCustomWidget.sendSubmit({ valid:true, value:"" });
    }); [2](https://projects.propublica.org/nonprofits/)
  }

  if (DEBUG) log("Loaded");
</script>
</body>
</html>
