<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EIN Eligibility Validator (Jotform Widget)</title>

  <!-- Correct Jotform Custom Widget API loader (required for JFCustomWidget.*) -->
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script> <!-- [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html) -->

  <style>
    :root{
      --ok:#107c10;
      --bad:#a80000;
      --warn:#8a6d3b;
      --muted:#605e5c;
      --border:#d6d6d6;
      --soft:#f7f7f7;
      --radius: 12px;
      --font: 14px/1.35 "Segoe UI", Arial, sans-serif;
    }
    body{ margin:0; padding:12px; font:var(--font); color:#111; background:#fff; }
    .card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px; background:#fff; }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    label{ font-weight:600; }
    input[type="text"]{
      padding:10px 12px; border:1px solid var(--border); border-radius:10px; width:220px;
    }
    select{
      padding:10px 12px; border:1px solid var(--border); border-radius:10px; width: 360px; max-width: 100%;
    }
    button{
      padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--soft); cursor:pointer;
    }
    button.primary{ background:#1f6feb; border-color:#1f6feb; color:#fff; }
    button:disabled{ opacity:.6; cursor:not-allowed; }

    .hint{ color:var(--muted); font-size:12px; margin-top:6px; }

    .badge{
      display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; border:1px solid transparent;
    }
    .badge.ok{ color:var(--ok); border-color: rgba(16,124,16,.35); background: rgba(16,124,16,.08); }
    .badge.bad{ color:var(--bad); border-color: rgba(168,0,0,.35); background: rgba(168,0,0,.08); }
    .badge.warn{ color:var(--warn); border-color: rgba(138,109,59,.35); background: rgba(138,109,59,.12); }
    .badge.neutral{ color:#333; border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.04); }

    .details{ white-space:pre-wrap; font-size:13px; margin-top:10px; }
    .warnBox{
      margin-top:10px; border:1px solid rgba(138,109,59,.35); background: rgba(138,109,59,.12);
      border-radius:10px; padding:10px; color:#5a4a1b; display:none;
    }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
</head>

<body>
  <div class="card">
    <div class="row">
      <div>
        <label for="ein">EIN</label><br/>
        <input id="ein" type="text" inputmode="numeric" placeholder="9 digits (numbers only)" />
        <div class="hint">Format: <span class="mono" id="einPretty">—</span></div>
      </div>

      <div>
        <label for="orgType">Organization Type</label><br/>
        <select id="orgType">
          <option value="501c3">501(c)(3)</option>
          <option value="501c1">501(c)(1)</option>
          <option value="170c1">Government entity under IRC §170(c)(1)</option>
          <option value="other">Other</option>
        </select>
        <div class="hint">
          Note: “Other” always passes, but shows a documentation note.
        </div>
      </div>

      <div style="padding-top:18px;">
        <button id="validateBtn" class="primary" type="button">Validate</button>
      </div>
    </div>

    <div style="margin-top:12px;">
      <span id="badge" class="badge neutral">NOT VALIDATED</span>
      <div id="details" class="details">Enter EIN + Type, then click Validate.</div>
      <div id="warnBox" class="warnBox"></div>
    </div>
  </div>

  <script>
    // ProPublica Nonprofit Explorer API v2 base URL and org endpoint usage is documented. [2](https://www.youtube.com/watch?v=7DAa8L4pkcg)
    const PROPUBLICA_BASE = "https://projects.propublica.org/nonprofits/api/v2";

    // Your requested “Other” warning (kept as-is, including original spelling).
    const OTHER_WARNING =
      "Your EIN did not Pass validation of eligibility.  Additional documentation may be necessary. " +
      "Please attach any relevant supplemental docunments you have at the bottom of this application, " +
      "or we may request addional documentation before funds are issued.";

    const $ein = document.getElementById("ein");
    const $einPretty = document.getElementById("einPretty");
    const $type = document.getElementById("orgType");
    const $btn = document.getElementById("validateBtn");
    const $badge = document.getElementById("badge");
    const $details = document.getElementById("details");
    const $warn = document.getElementById("warnBox");

    // What we store in the widget value (Jotform stores strings; we store JSON string). [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
    let state = {
      ein: "",
      ein_pretty: "",
      claimed_type: "501c3",
      status: "NOT_VALIDATED",       // PASS | FAIL | NOT_VALIDATED
      propublica_found: null,        // true | false | null
      subsection_code: null,         // number | null
      organization_name: null,       // string | null
      warning: false,               // boolean
      message: "",
      checked_at: null,             // ISO string
      debug: ""                     // string (captures HTTP errors for troubleshooting)
    };

    // Jotform “required” validation uses this boolean at submit time. [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
    let isValidForSubmit = false;

    function normalizeEin(raw) {
      return String(raw || "").replace(/\D/g, "").slice(0, 9);
    }

    function formatEinPretty(d) {
      return (d && d.length === 9) ? (d.slice(0, 2) + "-" + d.slice(2)) : "—";
    }

    function setBadge(kind, text) {
      $badge.className = "badge " + kind;
      $badge.textContent = text;
    }

    function resizeToContent() {
      // Optional but improves appearance inside Jotform. [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
      try { JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight }); } catch {}
    }

    function sendLiveData() {
      // sendData updates the widget value during interaction. [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
      try { JFCustomWidget.sendData({ value: JSON.stringify(state) }); } catch {}
    }

    async function fetchOrganization(einDigits) {
      // ProPublica org endpoint: GET /organizations/:ein.json [2](https://www.youtube.com/watch?v=7DAa8L4pkcg)
      const url = `${PROPUBLICA_BASE}/organizations/${einDigits}.json`;

      const resp = await fetch(url, { method: "GET" }); // API uses GET requests [2](https://www.youtube.com/watch?v=7DAa8L4pkcg)

      if (resp.status === 404) return { found: false, org: null, debug: "HTTP 404 (not found)" };

      if (!resp.ok) {
        const body = await resp.text().catch(() => "");
        return { found: false, org: null, debug: `HTTP ${resp.status} ${body}`.trim() };
      }

      const data = await resp.json();
      return { found: !!data.organization, org: data.organization || null, debug: "OK" };
    }

    function decide(claimedType, found, subsection) {
      // Your rules:
      // - other: PASS + warning
      // - 170c1: PASS if NOT found
      // - 501c3: PASS if found AND subsection_code == 3
      // - 501c1: PASS if found AND subsection_code == 1
      if (claimedType === "other") return { pass: true, warn: true, reason: "OTHER_ALWAYS_PASS" };
      if (claimedType === "170c1") return { pass: !found, warn: false, reason: (!found ? "NOT_FOUND_MATCH_170C1_RULE" : "FOUND_CONFLICTS_170C1_RULE") };
      if (!found) return { pass: false, warn: false, reason: "NOT_FOUND" };
      if (claimedType === "501c3") return { pass: (subsection === 3), warn: false, reason: (subsection === 3 ? "MATCH_501C3" : "SUBSECTION_MISMATCH") };
      if (claimedType === "501c1") return { pass: (subsection === 1), warn: false, reason: (subsection === 1 ? "MATCH_501C1" : "SUBSECTION_MISMATCH") };
      return { pass: false, warn: false, reason: "UNKNOWN_SELECTION" };
    }

    function render() {
      if (state.status === "PASS" && state.warning) {
        setBadge("warn", "PASS (Other) — Documentation may be required");
      } else if (state.status === "PASS") {
        setBadge("ok", "PASS — Verified");
      } else if (state.status === "FAIL") {
        setBadge("bad", "FAIL — Not verified");
      } else {
        setBadge("neutral", "NOT VALIDATED");
      }

      const lines = [];
      lines.push(`EIN: ${state.ein_pretty} (${state.ein || "—"})`);
      lines.push(`Selected Type: ${state.claimed_type}`);
      if (state.propublica_found === true) {
        lines.push("ProPublica: Found organization");
        if (state.organization_name) lines.push(`Name: ${state.organization_name}`);
        if (typeof state.subsection_code === "number") lines.push(`subsection_code: ${state.subsection_code}`);
      } else if (state.propublica_found === false) {
        lines.push("ProPublica: No organization record found");
      } else {
        lines.push("ProPublica: (not checked)");
      }

      if (state.message) {
        lines.push("");
        lines.push(`Summary: ${state.message}`);
      }

      if (state.debug) {
        lines.push("");
        lines.push(`Debug: ${state.debug}`);
      }

      $details.textContent = lines.join("\n");

      if (state.warning) {
        $warn.style.display = "block";
        $warn.textContent = OTHER_WARNING;
      } else {
        $warn.style.display = "none";
        $warn.textContent = "";
      }

      resizeToContent();
    }

    async function validate() {
      const einDigits = normalizeEin($ein.value);
      const claimed = $type.value;

      state.claimed_type = claimed;
      state.ein = einDigits;
      state.ein_pretty = formatEinPretty(einDigits);
      state.checked_at = new Date().toISOString();
      state.warning = false;
      state.organization_name = null;
      state.subsection_code = null;
      state.propublica_found = null;
      state.message = "";
      state.debug = "";

      $einPretty.textContent = state.ein_pretty;

      // Basic EIN format check
      if (einDigits.length !== 9) {
        state.status = "FAIL";
        state.message = "EIN must be exactly 9 digits (numbers only).";
        isValidForSubmit = false;
        render();
        sendLiveData();
        return;
      }

      // Other: pass with warning; no API call
      if (claimed === "other") {
        state.status = "PASS";
        state.warning = true;
        state.message = "Other selected. Additional documentation may be necessary.";
        isValidForSubmit = true; // passes required validation
        render();
        sendLiveData();
        return;
      }

      // Call ProPublica (JSON only, no callback param)
      $btn.disabled = true;
      setBadge("neutral", "CHECKING…");
      $details.textContent = "Checking ProPublica…";
      $warn.style.display = "none";
      resizeToContent();

      try {
        const res = await fetchOrganization(einDigits);

        state.propublica_found = res.found;
        state.debug = res.debug;

        const org = res.org;
        state.organization_name = org?.name ? String(org.name) : null;
        state.subsection_code = (typeof org?.subsection_code === "number") ? org.subsection_code : null;

        const d = decide(claimed, res.found, state.subsection_code);
        state.status = d.pass ? "PASS" : "FAIL";
        isValidForSubmit = d.pass;

        if (claimed === "170c1") {
          state.message = d.pass
            ? "No ProPublica organization record found (passes 170(c)(1) rule)."
            : "ProPublica found an exempt organization record (fails 170(c)(1) rule).";
        } else {
          state.message = d.pass
            ? "Selection matches ProPublica classification."
            : (res.found ? "EIN found, but does not match the selected type." : "No ProPublica organization record found for this EIN.");
        }

      } catch (e) {
        state.status = "FAIL";
        state.message = "Validation failed due to a network/API error.";
        state.debug = String(e.message || e);
        isValidForSubmit = false;
      } finally {
        $btn.disabled = false;
        render();
        sendLiveData();
      }
    }

    // UI events
    $btn.addEventListener("click", validate);

    $ein.addEventListener("input", () => {
      const digits = normalizeEin($ein.value);
      if (digits.length > 9) $ein.value = digits.slice(0, 9);
      $einPretty.textContent = formatEinPretty(normalizeEin($ein.value));

      // Any input change invalidates previous validation
      state.status = "NOT VALIDATED";
      state.message = "";
      state.debug = "";
      isValidForSubmit = false;
      render();
      sendLiveData();
    });

    $type.addEventListener("change", () => {
      // Any type change invalidates previous validation
      state.status = "NOT VALIDATED";
      state.message = "";
      state.debug = "";
      isValidForSubmit = false;
      render();
      sendLiveData();
    });

    // Jotform widget lifecycle hooks [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
    JFCustomWidget.subscribe("ready", function(data) {
      // Restore previous value when editing a submission [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
      if (data && data.value) {
        try {
          const prev = JSON.parse(data.value);
          if (prev && typeof prev === "object") {
            state = Object.assign(state, prev);

            $ein.value = state.ein || "";
            $einPretty.textContent = state.ein_pretty || formatEinPretty(state.ein);

            if (state.claimed_type) $type.value = state.claimed_type;

            // PASS means valid; Other is also PASS
            isValidForSubmit = (state.status === "PASS");
            render();
          }
        } catch {
          // ignore parse errors
        }
      }
      resizeToContent();
      sendLiveData();
    });

    JFCustomWidget.subscribe("submit", function() {
      // sendSubmit controls required validation (valid must be true) [1](https://www.floik.com/gallery/jotform/How-To-Set-A-Condition-On-Jotform-d.html)
      JFCustomWidget.sendSubmit({
        valid: !!isValidForSubmit,
        value: JSON.stringify(state)
      });
    });
  </script>
</body>
</html>
